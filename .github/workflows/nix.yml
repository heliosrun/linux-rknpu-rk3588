name: Nix build

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      nix: ${{ steps.filter.outputs.nix }}
    steps:
      - name: Detect changed paths
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"
          elif [ "${{ github.event_name }}" = "push" ] && ! [[ "${{ github.event.before }}" =~ ^0+$ ]]; then
            RANGE="${{ github.event.before }}...${{ github.sha }}"
          else
            RANGE=""
          fi
          if [ -z "$RANGE" ]; then
            FILES="FORCE-ALL"
          else
            FILES=$(gh api "repos/${{ github.repository }}/compare/$RANGE" --paginate --jq ".files[].filename") || FILES="FORCE-ALL"
          fi
          match() {
            [ "$FILES" = "FORCE-ALL" ] && return 0
            local f
            while IFS= read -r f; do
              case "$f" in $1) return 0;; esac
            done <<< "$FILES"
            return 1
          }
          if match "driver/*" || match "nix/*" || match "flake.*" || match ".github/workflows/nix.yml"; then
            NIX=true
          else
            NIX=false
          fi
          echo "nix=$NIX" >> "$GITHUB_OUTPUT"

  nix-build-arm64:
    needs: changes
    if: needs.changes.outputs.nix == "true"
    runs-on: blacksmith-8vcpu-ubuntu-2404-arm
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: useblacksmith/checkout@v1

      - name: Install nix
        uses: DeterminateSystems/nix-installer-action@v16
        with:
          extra-conf: |
            accept-flake-config = true

      - name: Build rknpu module (out-of-tree vs nixpkgs linuxPackages_latest)
        run: nix build -L .#packages.aarch64-linux.rknpu -o result-module

      - name: Check device tree overlay (nixpkgs kernel DTBs)
        run: nix build -L .#checks.aarch64-linux.device-tree -o result-dtcheck

      - name: Verify vermagic
        run: |
          KO=$(find result-module/lib/modules -name rknpu.ko)
          echo "module: $KO"
          objdump -s -j .modinfo "$KO" | tail -4

      - name: Store artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rknpu-nix-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            result-module/lib/modules/**/rknpu.ko
            result-dtcheck/board-applied.dtb
