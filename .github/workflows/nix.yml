name: Nix build

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - driver/**
      - nix/**
      - flake.*
      - .github/workflows/nix.yml
  pull_request:
    paths:
      - driver/**
      - nix/**
      - flake.*
      - .github/workflows/nix.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nix-build-arm64:
    runs-on: blacksmith-8vcpu-ubuntu-2404-arm
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: useblacksmith/checkout@v1

      - name: Install nix
        uses: DeterminateSystems/nix-installer-action@v16
        with:
          extra-conf: |
            accept-flake-config = true

      - name: Build rknpu module (out-of-tree vs nixpkgs linuxPackages_latest)
        run: nix build -L .#packages.aarch64-linux.rknpu -o result-module

      - name: Check device tree overlay (nixpkgs kernel DTBs)
        run: nix build -L .#checks.aarch64-linux.device-tree -o result-dtcheck

      - name: Verify vermagic
        run: |
          KO=$(find result-module/lib/modules -name rknpu.ko)
          echo "module: $KO"
          objdump -s -j .modinfo "$KO" | tail -4

      - name: Store artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rknpu-nix-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            result-module/lib/modules/**/rknpu.ko
            result-dtcheck/board-applied.dtb
