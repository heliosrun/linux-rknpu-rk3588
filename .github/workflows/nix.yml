name: Nix build

on:
  workflow_dispatch:
  # Weekly drift detection: scheduled runs ignore paths filters, so this
  # exercises the port against whatever linuxPackages_latest has become.
  schedule:
    - cron: "0 6 * * 1"
  push:
    branches: [ main ]
    paths:
      - driver/**
      - nix/**
      - flake.*
      - .github/workflows/nix.yml
  pull_request:
    paths:
      - driver/**
      - nix/**
      - flake.*
      - .github/workflows/nix.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nix-build-arm64:
    runs-on: blacksmith-8vcpu-ubuntu-2404-arm
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1

      - name: Install nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          extra-conf: |
            accept-flake-config = true

      # Fast eval gate: catches flake structural errors (e.g.
      # untracked files, bad attrs) in seconds, before any building.
      - name: Evaluate flake
        run: nix flake check --no-build --print-build-logs

      - name: Build rknpu module (out-of-tree vs nixpkgs linuxPackages_latest)
        run: nix build -L .#packages.aarch64-linux.rknpu -o result-module

      - name: Check device tree overlay (nixpkgs kernel DTBs)
        run: nix build -L .#checks.aarch64-linux.device-tree -o result-dtcheck

      - name: Verify vermagic
        run: |
          KO=$(find result-module/lib/modules -name rknpu.ko)
          echo "module: $KO"
          objdump -s -j .modinfo "$KO" | tail -4

      - name: Store artifact
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4d # v5
        with:
          name: rknpu-nix-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            result-module/lib/modules/**/rknpu.ko
            result-dtcheck/board-applied.dtb
