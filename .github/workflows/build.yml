name: Build RKNPU module

on:
  workflow_dispatch:
    inputs:
      kernel_ref:
        description: Linux tag to build against
        default: v7.2
      ccache_maxsize:
        description: ccache maximum size
        default: 5G
  push:
    branches: [ main ]
    paths:
      - driver/**
      - linux-integration/**
      - nix/overlay.dts
      - scripts/**
      - .github/workflows/build.yml
  pull_request:
    paths:
      - driver/**
      - linux-integration/**
      - nix/overlay.dts
      - scripts/**
      - .github/workflows/build.yml

# Prevent concurrent runs from fighting over the cache and the runner pool.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KERNEL_REF: ${{ inputs.kernel_ref || 'v7.2' }}
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: ${{ inputs.ccache_maxsize || '5G' }}

jobs:
  build-arm64:
    runs-on: blacksmith-8vcpu-ubuntu-2404-arm
    timeout-minutes: 360
    steps:
      - name: Checkout this repo (driver/, nix/, linux-integration/)
        uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1
        with:
          path: rknpu

      - name: Restore kernel source
        id: src
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: linux
          key: linux-${{ env.KERNEL_REF }}-src-v3

      - name: Checkout Linux ${{ env.KERNEL_REF }} (pristine)
        if: steps.src.outputs.cache-hit != 'true'
        uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1
        with:
          repository: torvalds/linux
          ref: ${{ env.KERNEL_REF }}
          fetch-depth: 1
          path: linux

      # kbuild invokes git (setlocalversion) and a restored checkout can
      # carry runner-specific git mirror alternates that fail on a
      # different runner. The build does not need git; strip it. This
      # also keeps the saved cache clean for future restores.
      - name: Strip git metadata
        run: rm -rf linux/.git

      - name: Save kernel source
        if: steps.src.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: linux
          key: linux-${{ env.KERNEL_REF }}-src-v3

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential flex bison libssl-dev libelf-dev bc dwarves python3 gzip xz-utils device-tree-compiler ccache

      - name: Restore ccache
        id: cc
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ env.KERNEL_REF }}-${{ hashFiles('rknpu/driver/**') }}
          restore-keys: |
            ccache-${{ env.KERNEL_REF }}-

      # Pure out-of-tree build against a pristine kernel: no patching.
      # "all" = vmlinux + modules in one correctly ordered pass; the
      # modules pass needs vmlinux.symvers (built-in symbol exports) for
      # its modpost, and produces Module.symvers for our external link.
      - name: Build pristine kernel (vmlinux + modules)
        run: ./rknpu/scripts/build-kernel.sh linux

      - name: Build and verify rknpu module (out-of-tree)
        run: ./rknpu/scripts/build-module.sh linux "${{ github.workspace }}/rknpu/driver"

      # Apply the NixOS overlay to a pristine mainline DTB: proves the
      # overlay disables the rocket cores and creates the vendor node,
      # against unmodified upstream DTs.
      - name: Check device tree overlay
        run: ./rknpu/scripts/check-dt-overlay.sh linux "${{ github.workspace }}/rknpu/nix/overlay.dts"

      - name: Save ccache
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ env.KERNEL_REF }}-${{ hashFiles('rknpu/driver/**') }}-${{ github.run_id }}

      - name: Store build artifacts
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4d # v5
        with:
          name: rknpu-rk3588-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            rknpu/driver/rknpu.ko
            /tmp/rknpu.dtbo
            /tmp/board-applied.dtb
