name: Build RKNPU module

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:

# Prevent concurrent runs from fighting over the cache and the runner pool.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Bump this to port-verify against a newer mainline tag.
  KERNEL_REF: v7.2
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 5G
  BUILD_JOBS: 8

jobs:
  build-arm64:
    runs-on: blacksmith-8vcpu-ubuntu-2404-arm
    timeout-minutes: 360
    steps:
      - name: Checkout this repo (driver/, nix/, linux-integration/)
        uses: useblacksmith/checkout@v1
        with:
          path: rknpu

      - name: Restore kernel source
        id: src
        uses: actions/cache/restore@v4
        with:
          path: linux
          key: linux-${{ env.KERNEL_REF }}-src-v3

      - name: Checkout Linux ${{ env.KERNEL_REF }} (pristine)
        if: steps.src.outputs.cache-hit != 'true'
        uses: useblacksmith/checkout@v1
        with:
          repository: torvalds/linux
          ref: ${{ env.KERNEL_REF }}
          fetch-depth: 1
          path: linux

      # kbuild invokes git (setlocalversion) and a restored checkout can
      # carry runner-specific git mirror alternates that fail on a
      # different runner. The build does not need git; strip it. This
      # also keeps the saved cache clean for future restores.
      - name: Strip git metadata
        run: rm -rf linux/.git

      - name: Save kernel source
        if: steps.src.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: linux
          key: linux-${{ env.KERNEL_REF }}-src-v3

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential flex bison libssl-dev libelf-dev bc dwarves python3 gzip xz-utils device-tree-compiler ccache

      - name: Restore ccache
        id: cc
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ env.KERNEL_REF }}-${{ hashFiles('rknpu/driver/**') }}
          restore-keys: |
            ccache-${{ env.KERNEL_REF }}-

      # Pure out-of-tree build against a pristine kernel: no patching.
      # "all" = vmlinux + modules in one correctly ordered pass; the
      # modules pass needs vmlinux.symvers (built-in symbol exports) for
      # its modpost, and produces Module.symvers for our external link.
      - name: Build pristine kernel (vmlinux + modules)
        run: |
          cd linux
          make ARCH=arm64 O=build defconfig
          make ARCH=arm64 O=build CC="ccache gcc" -j"${{ env.BUILD_JOBS }}" all
          ls -la build/Module.symvers build/vmlinux

      - name: Build rknpu module (out-of-tree)
        run: |
          cd linux
          make ARCH=arm64 O=build CC="ccache gcc" -j"${{ env.BUILD_JOBS }}" M="${{ github.workspace }}/rknpu/driver" modules
          ls -la "${{ github.workspace }}/rknpu/driver/rknpu.ko"

      - name: Verify rknpu.ko
        run: |
          cd rknpu/driver
          echo "=== modinfo ==="
          modinfo rknpu.ko | head -30
          echo "=== vermagic ==="
          modinfo -F vermagic rknpu.ko
          echo "=== undefined symbols: $(nm rknpu.ko | grep -c ' U ') ==="

      # Apply the NixOS overlay to a pristine mainline DTB: proves the
      # overlay disables the rocket cores, enables the IOMMUs and
      # creates the vendor node, against unmodified upstream DTs.
      - name: Check device tree overlay
        run: |
          DTC=$(find /usr -name dtc -type f | head -1)
          FDTOVERLAY=$(find /usr -name fdtoverlay -type f | head -1)
          INC="${{ github.workspace }}/linux/scripts/dtc/include-prefixes"
          cd linux
          gcc -E -nostdinc -I"$INC" -undef -D__DTS__ -x assembler-with-cpp \
            "${{ github.workspace }}/rknpu/nix/overlay.dts" -o /tmp/overlay-pp.dts
          $DTC -@ -I dts -O dtb -o /tmp/rknpu.dtbo /tmp/overlay-pp.dts
          BASE=build/arch/arm64/boot/dts/rockchip/rk3588-friendlyelec-cm3588-nas.dtb
          # -@ so the DTB carries __symbols__: our label-based overlay
          # (same file the NixOS deviceTree machinery applies) needs it.
          make ARCH=arm64 O=build DTC_FLAGS="-@" -j"${{ env.BUILD_JOBS }}" dtbs
          $FDTOVERLAY -i "$BASE" -o /tmp/board-applied.dtb /tmp/rknpu.dtbo
          $DTC -I dtb -O dts /tmp/board-applied.dtb -o /tmp/board-applied.dts
          echo "=== vendor node status ==="
          grep -A3 'rknpu@fdab0000 {' /tmp/board-applied.dts | head -4
          echo "=== rocket cores disabled? ==="
          for c in rknn_core_0 rknn_core_1 rknn_core_2; do
            grep -A18 "$c: npu@" /tmp/board-applied.dts | grep -m1 status
          done
          echo "=== iommus enabled? ==="
          for m in fdab9000 fdaca000 fdada000; do
            grep -A12 "iommu@$m {" /tmp/board-applied.dts | grep -m1 status
          done

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ env.KERNEL_REF }}-${{ hashFiles('rknpu/driver/**') }}-${{ github.run_id }}

      - name: Store build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rknpu-rk3588-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            rknpu/driver/rknpu.ko
            /tmp/rknpu.dtbo
            /tmp/board-applied.dtb
